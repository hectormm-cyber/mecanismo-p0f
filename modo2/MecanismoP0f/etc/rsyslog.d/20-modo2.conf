
module(load="imtcp")
input(type="imtcp" port="514" ruleset="filiais")

template(name="FilialPath" type="string"
         string="/var/log/filiais/%hostname%/events.jsonl")
template(name="RawJson" type="string"
         string="%msg:R,ERE,0,DFLT:\\{.*--end%\n")

ruleset(name="filiais") {
  if $programname == "mecanismo" then {
    action(type="omfile" dynaFile="FilialPath" template="RawJson"
           createDirs="on" dirCreateMode="0755" fileCreateMode="0644")
  }
  stop
}

