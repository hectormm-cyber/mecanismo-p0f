
module(load="imfile")

input(type="imfile"
      File="/var/log/mecanismo/events.jsonl"
      Tag="mecanismo"
      Severity="info"
      Facility="local5")

local5.* action(type="omfwd"
                target="10.0.0.12"
                port="514"
                protocol="tcp"
                queue.type="LinkedList"
                queue.filename="mec_fwd"
                queue.maxdiskspace="500m"
                queue.saveOnShutdown="on"
                action.resumeRetryCount="-1")

